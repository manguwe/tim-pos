# Runs on every push. Tests the server and tools with Node, tests and analyses the Flutter app, and builds an APK.
# To build a release APK for shops, add these repository secrets (Settings > Secrets and variables > Actions):
#   TIMPOS_SERVER_URL, TIMPOS_LICENCE_PUBLIC_KEY   (and the four KEYSTORE_* secrets if you want a signed release)
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Server tests
        run: cd server && npm test
      - name: Tools tests (schema, sync against the real server, selling)
        run: cd tools && npm test
      - name: The generated files are up to date
        run: |
          cd tools && npm run -s gen
          git diff --exit-code -- ../app/assets/sql || (echo "Run npm run -s gen in tools and commit the result" && exit 1)

  flutter:
    runs-on: ubuntu-latest
    needs: node
    defaults: { run: { working-directory: app } }
    env:
      TIMPOS_KEY: ${{ secrets.TIMPOS_LICENCE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Native SQLite for the tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Create the Android project and apply our settings
        run: |
          flutter create --org zw.timpos --project-name tim_pos --platforms android ../_shell
          cp -r ../_shell/android ./android && rm -rf ../_shell
          python3 tool/prepare_android.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK
        if: ${{ env.TIMPOS_KEY != '' }}
        run: |
          flutter build apk --release \
            --dart-define=TIMPOS_SERVER_URL=${{ secrets.TIMPOS_SERVER_URL }} \
            --dart-define=TIMPOS_LICENCE_PUBLIC_KEY=$TIMPOS_KEY
      - uses: actions/upload-artifact@v4
        if: ${{ env.TIMPOS_KEY != '' }}
        with: { name: tim-pos-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }
